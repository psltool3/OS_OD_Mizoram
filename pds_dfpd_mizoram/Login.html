<!DOCTYPE html>
<html lang="en" class="body-full-height">
  <head>
    <!-- META SECTION -->
    <title>PDS Admin</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
     <script
      type="text/javascript"
      src="js/plugins/jquery/jquery.min.js"
    ></script>

    <script src="crypto-js/crypto-js.js"></script>
    <script src="js/Encryption.js"></script>

    <meta name="theme-color" content="#ffffff" />
    <!-- END META SECTION -->

    <!-- CSS INCLUDE -->
    <link
      rel="stylesheet"
      type="text/css"
      id="theme"
      href="css/theme-default.css"
    />
    <!-- EOF CSS INCLUDE -->

    <script>
      var captcha;
      function generateCaptcha() {
        document.getElementById("captchainput").value = "";
        captcha = document.getElementById("image");
        var uniquechar = "";
        const randomchar =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        for (let i = 1; i < 5; i++) {
          uniquechar += randomchar.charAt(Math.random() * randomchar.length);
        }
        captcha.innerHTML = uniquechar;
        $.ajax({
          url: "captcha.php",
          method: "POST",
          data: { captcha: uniquechar },
          success: function (response) {
            console.log("CAPTCHA stored. ");
          },
        });
      }

      function verifyCaptcha() {
        const usr_input = document.getElementById("captchainput").value;
        if (usr_input == captcha.innerHTML) {
          var readableString = document.getElementById("password").value;
          var nonceValue = "nonce_value";
          let encryption = new Encryption();
          var encrypted = encryption.encrypt(readableString, nonceValue);
          document.getElementById("password").value = encrypted;
          return true;
        } else {
          alert("Incorrect Captcha");
          generateCaptcha();
          return false;
        }
      }
    </script>
    <script>
      // Function to fetch and inject CSRF token
      function injectCSRFToken() {
        fetch("get_token.php") // Request CSRF token from PHP
          .then((response) => response.text())
          .then((token) => {
            // Inject the token into the hidden input field
            document.getElementById("csrf_token").value = token;
          })
          .catch((err) => {
            console.log("Error fetching CSRF token:", err);
          });
      }
      // Call the function when the page loads
      window.onload = injectCSRFToken;
    </script>

    <style>
      #image {
        position: relative;
        width: 80px;
        height: 60px;
        padding: 10px;
        margin-left: 119px;
        font-weight: 600;
        font-style: italic;
        font-size: x-large;
        color: #fff;
        user-select: none;
        border: 2px solid #2798d5;
        background-color: #000;
        text-align: center;
        line-height: 40px;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
      }

      /* Simulate double line-through using two pseudo-elements */
      #image::before,
      #image::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background-color: #fff;
      }

      #image::before {
        top: 50%;
      }

      #image::after {
        top: 60%;
      }

      .login-container {
        background-image: url("img/AndhraPradesh2.png");
        background-image: url("img/AndhraPradesh3.png");
        background-image: url("img/Punjab-login-backdrop.png");

        background-size: cover;
      }
      .login-container {
        background-size: cover;
        background-position: center;
        animation: slideshow 10s infinite;
      }

      @keyframes slideshow {
        0%,
        100% {
          background-image: url("img/AndhraPradesh2.png");
        }
        50% {
          background-image: url("img/AndhraPradesh3.png");
        }
      }

      .login-body {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <b
        ><a
          href="../pds_admin_mizoram/Login.html"
          style="
            color: #fff;
            padding: 10px;
            background-color: #000;
            font-size: 30px;
            text-decoration: none;
            border-radius: 10px;
          "
          >Home Page</a
        ></b
      >

      <div class="login-box animated fadeInDown" style="margin-top: -50px">
        <div
          class="login-body"
          style="background-color: #060505"
          autocomplete="off"
        >
          <div class="login-title"><strong>Welcome</strong>, Please login</div>
          <form
            action="api/Login.php"
            class="form-horizontal"
            method="post"
            onsubmit="return verifyCaptcha()"
          >
            <div class="form-group">
              <div class="col-md-12">
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="form-control"
                  placeholder="Username"
                  style="background-color: #2b2929"
                  autocomplete="off"
                  pattern="^[a-zA-Z0-9_@\.]+$"
                  maxlength="50"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <div class="col-md-12">
                <input
                  type="password" autocomplete="off"
                  id="password"
                  name="password"
                  class="form-control"
                  placeholder="Password"
                  style="background-color: #2b2929"
                  autocomplete="off"
                  maxlength="128"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <div class="col-md-12">
                <input
                  type="text"
                  id="captchainput"
                  name="captchainput"
                  class="form-control"
                  placeholder="Captcha Code"
                  required
                  style="background-color: #2b2929"
                  ;
                />
              </div>
            </div>
            <div class="form-group">
              <div class="col-md-12">
                <input
                  type="hidden"
                  id="csrf_token"
                  name="csrf_token"
                  class="form-control"
                />
              </div>
            </div>
            <div class="form-group">
              <div class="row">
                <div class="col-md-8">
                  <center>
                    <div id="image" selectable="False"></div>
                  </center>
                </div>
                <div class="col-md-4">
                  <center>
                    <span
                      class="fa fa-refresh"
                      style="font-size: 30px; color: white; margin-top: 20px"
                      onclick="generateCaptcha()"
                    ></span>
                  </center>
                </div>
              </div>
            </div>

            <div class="form-group">
              <center>
                <button class="btn btn-info btn-block" style="width: 50%">
                  Log In
                </button>
              </center>
            </div>
          </form>
        </div>
        <div class="login-footer" style="background-color: #060505">
          <div class="pull-left">
            <!-- <a href="Signup.html"><h5 style="color: #fff">Signup</h5></a> -->
          </div>
          <div class="pull-right">
            <a href="Reset.html"><h5 style="color: #fff">Reset Password</h5></a>
          </div>
        </div>
      </div>
    </div>

    <script>
      generateCaptcha();
    </script>
  </body>
</html>
